<div class="admin-shell">

  <div class="a-sidebar">
    <div class="a-brand">
      <div class="logo"><img src="logo-icon.svg" alt="MaliMall" style="width:100%;height:100%;object-fit:contain;" /></div>
      <div><b>MaliMall</b><span>Console admin</span></div>
    </div>
    <div class="a-nav">
      <a routerLink="/vue-ensemble" routerLinkActive="active" class="a-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Vue d'ensemble</span>
      </a>
      <a routerLink="/utilisateurs" routerLinkActive="active" class="a-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke-linecap="round"/></svg>
        <span>Utilisateurs</span>
      </a>
      <a routerLink="/boutiques" routerLinkActive="active" class="a-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0" stroke-linecap="round"/></svg>
        <span>Boutiques &amp; produits</span>
      </a>
      <a routerLink="/publicites" routerLinkActive="active" class="a-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M7 20h10M9 17v3M15 17v3" stroke-linecap="round"/></svg>
        <span>Publicités</span>
      </a>
      <a routerLink="/commandes" routerLinkActive="active" class="a-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18" stroke-linecap="round"/></svg>
        <span>Commandes Market</span>
      </a>
      <a routerLink="/mototaxis" routerLinkActive="active" class="a-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="17" r="2.6"/><circle cx="17.5" cy="17" r="2.6"/><path d="M9 17h4.5l2.3-6.4h2.7M9.3 17l2.9-7.8h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>MotoTaxis</span>
      </a>
      <a routerLink="/revenus" routerLinkActive="active" class="a-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M9.3 9c0-1.5 1.3-2.6 2.9-2.6 1.7 0 3 1.1 3 2.5 0 3.3-6 1.7-6 5 0 1.4 1.4 2.6 3.1 2.6 1.7 0 3-1.1 3-2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Revenus</span>
      </a>
    </div>
    <div class="a-nav-foot">
      <button class="a-logout" (click)="deconnexion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </div>

  <div class="a-main">
    <router-outlet></router-outlet>
  </div>
</div>
